name: Deploy starter to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'Workshop01_Web-development-basics-guide/**'  
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload starter folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: './Workshop01_Web-development-basics-guide/starter'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4